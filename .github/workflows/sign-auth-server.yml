name: Build and Publish Auth Server
run-name: ${{ github.event.client_payload.release_id }}

on:
  repository_dispatch:
    types:
      - parent-auth-release

permissions:
  contents: write

concurrency:
  group: build-auth-server-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor == 'Lakr233'
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.context.outputs.source_ref }}
      version: ${{ steps.context.outputs.version }}
      parent_ref: ${{ steps.context.outputs.parent_ref }}
      parent_sha: ${{ steps.context.outputs.parent_sha }}
      release_ref: ${{ steps.context.outputs.release_ref }}

    steps:
      - name: Validate Parent Release Context
        id: context
        run: |
          set -euo pipefail
          VERSION="${{ github.event.client_payload.version }}"
          SOURCE_REF="${{ github.event.client_payload.source_ref }}"
          RELEASE_REF="${{ github.event.client_payload.release_ref }}"
          PARENT_REPOSITORY="${{ github.event.client_payload.parent_repository }}"
          PARENT_REF="${{ github.event.client_payload.parent_ref }}"
          PARENT_SHA="${{ github.event.client_payload.parent_sha }}"
          RELEASE_ID="${{ github.event.client_payload.release_id }}"

          [[ "$PARENT_REPOSITORY" == "LookInsideApp/LookInside-MonoRepo" ]] || {
            echo "Release must be dispatched by the LookInside parent ledger." >&2
            exit 1
          }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "App version must match X.Y.Z." >&2; exit 1; }
          [[ "$PARENT_REF" == "refs/tags/release/app/$VERSION" ]] || {
            echo "Parent ref does not match the app release version." >&2
            exit 1
          }
          [[ "$PARENT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid parent SHA." >&2; exit 1; }
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Auth source SHA." >&2; exit 1; }
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Release source SHA." >&2; exit 1; }
          [[ "$RELEASE_ID" == "release/app/$VERSION@$PARENT_SHA/auth" ]] || {
            echo "Release id does not identify the parent tag and commit." >&2
            exit 1
          }

          {
            echo "source_ref=$SOURCE_REF"
            echo "version=$VERSION"
            echo "parent_ref=$PARENT_REF"
            echo "parent_sha=$PARENT_SHA"
            echo "release_ref=$RELEASE_REF"
          } >>"$GITHUB_OUTPUT"

  build_and_sign:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout shim repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          path: shim
          token: ${{ github.token }}

      - name: Checkout authenticator source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AUTH_SOURCE_REPO }}
          ref: ${{ needs.prepare.outputs.source_ref }}
          path: authenticator
          token: ${{ secrets.LOOKINSIDE_WEB_RELEASE_TOKEN || secrets.UPSTREAM_MIRROR_TOKEN }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install mise
        run: brew install mise

      - name: Install tuist via mise
        working-directory: authenticator
        run: |
          mise trust
          mise install

      - name: Validate Pinned Auth Source
        working-directory: authenticator
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ needs.prepare.outputs.source_ref }}" ]] || {
            echo "Authenticator checkout does not match the pinned parent source." >&2
            exit 1
          }

      - name: Build unsigned auth server app
        working-directory: authenticator
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.version }}
        run: make app

      - name: Extract app bundle
        id: extract
        run: |
          set -euo pipefail
          mkdir -p build/extracted
          ditto -x -k authenticator/lookinside-auth-server.app.zip build/extracted
          app_path="$(find build/extracted -maxdepth 2 -type d -name "*.app" | head -n 1)"
          [[ -n "$app_path" ]] || { echo "No .app bundle found after extraction." >&2; exit 1; }
          absolute_app_path="$(cd "$(dirname "$app_path")" && pwd)/$(basename "$app_path")"
          echo "app_path=$absolute_app_path" >> "$GITHUB_OUTPUT"
          echo "Extracted app: $absolute_app_path"

      - name: Validate app architectures
        run: |
          set -euo pipefail
          executable="${{ steps.extract.outputs.app_path }}/Contents/MacOS/lookinside-auth-server"
          [[ -x "$executable" ]] || { echo "Missing executable: $executable" >&2; exit 1; }
          archs="$(lipo -archs "$executable")"
          echo "Executable architectures: $archs"
          for required in arm64 x86_64; do
            case " $archs " in
              *" $required "*) ;;
              *) echo "Missing required architecture '$required' in $executable" >&2; exit 1 ;;
            esac
          done
          file "$executable"

      - name: Setup keychain and signing env
        id: setup_keychain
        env:
          KEYCHAIN_CONTENT_GZIP: ${{ secrets.KEYCHAIN_CONTENT_GZIP }}
          KEYCHAIN_SECRET: ${{ secrets.KEYCHAIN_SECRET }}
        run: bash shim/Scripts/setup-ci-keychain.sh --output-file "$GITHUB_OUTPUT"

      - name: Sign and notarize app
        env:
          SIGNING_IDENTITY: ${{ steps.setup_keychain.outputs.signing_identity }}
          DEVELOPMENT_TEAM: ${{ steps.setup_keychain.outputs.development_team }}
          KEYCHAIN_PATH: ${{ steps.setup_keychain.outputs.keychain_path }}
          KEYCHAIN_PROFILE: ${{ steps.setup_keychain.outputs.keychain_profile }}
          KEYCHAIN_SECRET: ${{ secrets.KEYCHAIN_SECRET }}
        run: |
          bash shim/Scripts/sign-and-notarize-app.sh \
            --app "${{ steps.extract.outputs.app_path }}" \
            --output "build/signed/lookinside-auth-server.app.zip"

      - name: Ensure storage release exists
        working-directory: shim
        run: |
          set -euo pipefail
          if ! gh release view storage --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create storage \
              --repo "$GITHUB_REPOSITORY" \
              --title "Binary Storage" \
              --notes "Signed binary artifacts. Always the latest build."
          fi

      - name: Upload signed app
        run: |
          gh release upload storage "build/signed/lookinside-auth-server.app.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload checksum
        run: |
          set -euo pipefail
          cd build/signed
          shasum -a 256 lookinside-auth-server.app.zip > lookinside-auth-server.app.zip.sha256
          gh release upload storage lookinside-auth-server.app.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload version marker
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd build/signed
          version_asset="lookinside-auth-server.app.zip.version"
          printf '%s\n' "$MARKETING_VERSION" > "$version_asset"
          gh release upload storage "$version_asset" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Tag published Auth source
        env:
          GH_TOKEN: ${{ secrets.LOOKINSIDE_WEB_RELEASE_TOKEN || secrets.UPSTREAM_MIRROR_TOKEN }}
          AUTH_REPOSITORY: ${{ secrets.AUTH_SOURCE_REPO }}
          AUTH_REF: ${{ needs.prepare.outputs.source_ref }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo "Cross-repository release token is required." >&2; exit 1; }
          [[ -n "$AUTH_REPOSITORY" ]] || { echo "AUTH_SOURCE_REPO is required." >&2; exit 1; }

          existing_ref="$(gh api "repos/$AUTH_REPOSITORY/commits/$VERSION" --jq .sha 2>/dev/null || true)"
          if [[ -n "$existing_ref" ]]; then
            [[ "$existing_ref" == "$AUTH_REF" ]] || {
              echo "Auth tag $VERSION already targets $existing_ref instead of $AUTH_REF." >&2
              exit 1
            }
          else
            gh api --method POST "repos/$AUTH_REPOSITORY/git/refs" \
              -f ref="refs/tags/$VERSION" \
              -f sha="$AUTH_REF" >/dev/null
          fi

          published_ref="$(gh api "repos/$AUTH_REPOSITORY/commits/$VERSION" --jq .sha)"
          [[ "$published_ref" == "$AUTH_REF" ]] || {
            echo "Published Auth tag $VERSION does not resolve to $AUTH_REF." >&2
            exit 1
          }
