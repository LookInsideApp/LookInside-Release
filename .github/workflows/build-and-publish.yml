name: Build and Publish
run-name: ${{ github.event.client_payload.release_id }}

on:
  repository_dispatch:
    types:
      - parent-sdk-release

concurrency:
  group: build-and-publish-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.actor == 'Lakr233'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_MIRROR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.UPSTREAM_MIRROR_TOKEN }}
      UPSTREAM_MIRROR_TOKEN: ${{ secrets.UPSTREAM_MIRROR_TOKEN }}
      UPSTREAM_SERVER_REPO_URL: ${{ secrets.UPSTREAM_SERVER_REPO_URL }}

    steps:
      - name: Validate Parent Release Context
        id: context
        run: |
          set -euo pipefail
          VERSION="${{ github.event.client_payload.version }}"
          SOURCE_REF="${{ github.event.client_payload.source_ref }}"
          PARENT_REPOSITORY="${{ github.event.client_payload.parent_repository }}"
          PARENT_REF="${{ github.event.client_payload.parent_ref }}"
          PARENT_SHA="${{ github.event.client_payload.parent_sha }}"
          RELEASE_ID="${{ github.event.client_payload.release_id }}"

          [[ "$PARENT_REPOSITORY" == "LookInsideApp/LookInside-MonoRepo" ]] || {
            echo "Release must be dispatched by the LookInside parent ledger." >&2
            exit 1
          }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "SDK version must match X.Y.Z." >&2; exit 1; }
          [[ "$PARENT_REF" == "refs/tags/release/sdk/$VERSION" ]] || {
            echo "Parent ref does not match the SDK release version." >&2
            exit 1
          }
          [[ "$PARENT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid parent SHA." >&2; exit 1; }
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Server source SHA." >&2; exit 1; }
          [[ "$RELEASE_ID" == "release/sdk/$VERSION@$PARENT_SHA/sdk" ]] || {
            echo "Release id does not identify the parent tag and commit." >&2
            exit 1
          }

          {
            echo "version=$VERSION"
            echo "source_ref=$SOURCE_REF"
            echo "parent_ref=$PARENT_REF"
            echo "parent_sha=$PARENT_SHA"
          } >>"$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.UPSTREAM_MIRROR_TOKEN }}
          fetch-depth: 0

      - name: Validate Release Version
        env:
          VERSION: ${{ steps.context.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          latest_tag="$(git tag --list --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          python3 - "$latest_tag" "$VERSION" <<'PY'
          import sys

          latest, requested = sys.argv[1:]
          current = tuple(int(part) for part in requested.split("."))
          if latest and current <= tuple(int(part) for part in latest.split(".")):
              raise SystemExit(f"SDK version {requested} must be greater than latest tag {latest}.")
          PY
          if git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            echo "SDK tag $VERSION already exists." >&2
            exit 1
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Set up signing keychain
        id: setup_keychain
        env:
          KEYCHAIN_CONTENT_GZIP: ${{ secrets.KEYCHAIN_CONTENT_GZIP }}
          KEYCHAIN_SECRET: ${{ secrets.KEYCHAIN_SECRET }}
          PRESERVE_KEYCHAIN_STATE: "1"
        run: bash Scripts/setup-ci-keychain.sh --output-file "$GITHUB_OUTPUT"

      - name: Build Pinned Binary and Render Manifest
        env:
          SIGNING_IDENTITY: ${{ steps.setup_keychain.outputs.signing_identity }}
          DEVELOPMENT_TEAM: ${{ steps.setup_keychain.outputs.development_team }}
          KEYCHAIN_PATH: ${{ steps.setup_keychain.outputs.keychain_path }}
          KEYCHAIN_PROFILE: ${{ steps.setup_keychain.outputs.keychain_profile }}
          KEYCHAIN_SECRET: ${{ secrets.KEYCHAIN_SECRET }}
          REQUIRE_SIGNED_MACOS: "1"
        run: |
          ./Scripts/build_and_publish.py \
            --release-tag "${{ steps.context.outputs.version }}" \
            --source lookinside-server \
            --source-ref "${{ steps.context.outputs.source_ref }}"

      - name: Commit Manifest and Create Tag
        env:
          VERSION: ${{ steps.context.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Package.swift Tests LookInsideServer.podspec; then
            echo "Pinned SDK build produced no release manifest change." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift Tests LookInsideServer.podspec
          git commit -m "Build and publish $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main "$VERSION"

      - name: Publish Version Release
        env:
          VERSION: ${{ steps.context.outputs.version }}
          SOURCE_REF: ${{ steps.context.outputs.source_ref }}
          PARENT_REF: ${{ steps.context.outputs.parent_ref }}
          PARENT_SHA: ${{ steps.context.outputs.parent_sha }}
        run: |
          gh release create "$VERSION" \
            --verify-tag \
            --title "$VERSION" \
            --notes "Built from LookInside-Server@$SOURCE_REF via $PARENT_REF@$PARENT_SHA." \
            build/release-assets/*.zip

      - name: Lint CocoaPods podspec
        run: pod spec lint LookInsideServer.podspec --allow-warnings

      - name: Build CocoaPods integration fixture
        run: Scripts/test_cocoapods_integration.sh "${{ steps.context.outputs.version }}"
